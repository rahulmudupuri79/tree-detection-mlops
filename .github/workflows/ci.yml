name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Allow at most one active run for this workflow across all refs.
# GitHub keeps one pending run; a newer pending run can replace an older pending run.
concurrency:
  group: ci-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  quality:
    name: Lint and test (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install quality tools
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: python -m pytest -q
